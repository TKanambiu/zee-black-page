name: Build and Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies and Build
      run: |
        bun install
        bun run build

    # Clean, robust file sync via appleboy scp engine
    - name: Sync built files via Secure SFTP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: '51.91.29.218'
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 1624
        source: ".output/public/*"
        target: "public_html/"
        strip_components: 2 # Removes the '.output/public/' folder levels so files land directly inside public_html
