name: Build and Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies and Build
      run: |
        bun install
        bun run build

    # Debug step to display the exact folders created by your project build
    - name: List files in output directory
      run: ls -R dist || ls -R build || echo "No directory found"

    # Targets the base dist directory directly
    - name: Sync built files to cPanel via SFTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 1624
        local-dir: ./dist/
        server-dir: public_html/
