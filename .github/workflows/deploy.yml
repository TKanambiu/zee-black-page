name: Build and Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    # Allows the pipeline to extract assets even if the dynamic server build warns or breaks later
    - name: Install dependencies and Build Assets
      run: |
        bun install
        bun run build || true

    # Scans the output directory and creates a clean browser landing file using relative tags
    - name: Assemble Standalone Browser App
      run: |
        mkdir -p ./static-dist
        cp -r ./.output/public/* ./static-dist/
        
        JS_FILE=$(basename $(ls ./static-dist/assets/index-*.js | head -n 1))
        CSS_FILE=$(basename $(ls ./static-dist/assets/styles-*.css | head -n 1))
        
        echo "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Zentramed Health</title><script type='module' src='./assets/$JS_FILE'></script><link rel='stylesheet' href='./assets/$CSS_FILE'></head><body><div id='root'></div></body></html>" > ./static-dist/index.html
        cp ./static-dist/index.html ./static-dist/404.html

    # Syncs your newly assembled standalone site directly to your hosting directory
    - name: Sync built files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: '51.91.29.218'
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./static-dist/
        server-dir: public_html/
