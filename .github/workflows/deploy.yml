name: Build and Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies and Build
      run: |
        bun install
        bun run build

    # Automatically converts full-stack Nitro layout to static HTML fallback files
    - name: Convert to Static SPA Files
      run: |
        mkdir -p ./static-dist
        cp -r ./.output/public/* ./static-dist/ 2>/dev/null || cp -r ./dist/client/* ./static-dist/ 2>/dev/null || cp -r ./dist/* ./static-dist/ 2>/dev/null || true
        if [ -f "./static-dist/assets/index-*.js" ] || [ -d "./static-dist/assets" ]; then
          cp ./static-dist/index.html ./static-dist/404.html 2>/dev/null || true
        fi

    # Syncs the finalized browser asset package straight to your public directory
    - name: Sync built files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: '51.91.29.218'
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./static-dist/
        server-dir: public_html/
