name: Build and Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies and Build Assets
      run: |
        bun install
        bun run build || true

    # Injects the missing fallback landing document so cPanel launches the app
    - name: Inject Root Fallback Document
      run: |
        if [ -d "./.output/public" ] && [ ! -f "./.output/public/index.html" ]; then
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zentramed Health</title><script type="module" src="/assets/index-BI0dNmo7.js"></script><link rel="stylesheet" href="/assets/styles-B-kWzFPB.css"></head><body><div id="root"></div></body></html>' > ./.output/public/index.html
        fi

    - name: Sync built files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: '51.91.29.218'
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./.output/public/
        server-dir: public_html/
